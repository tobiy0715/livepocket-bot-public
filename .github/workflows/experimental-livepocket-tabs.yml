name: Experimental LivePocket Tabs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/experimental_livepocket_tabs_v1.js'
      - '.github/workflows/experimental-livepocket-tabs.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run isolated tab probe
        run: node scripts/experimental_livepocket_tabs_v1.js
