name: Experimental LivePocket Tabs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/experimental_livepocket_tabs_v1.js'
      - 'scripts/livepocket_browser_bridge_v1.js'
      - 'scripts/test_livepocket_browser_bridge_v1.js'
      - 'scripts/livepocket_safari_capture_v1.js'
      - 'scripts/test_livepocket_safari_capture_v1.js'
      - '.github/workflows/experimental-livepocket-tabs.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check scripts/experimental_livepocket_tabs_v1.js
          node --check scripts/livepocket_browser_bridge_v1.js
          node --check scripts/test_livepocket_browser_bridge_v1.js
          node --check scripts/livepocket_safari_capture_v1.js
          node --check scripts/test_livepocket_safari_capture_v1.js
      - name: Browser bridge contract test
        run: node scripts/test_livepocket_browser_bridge_v1.js
      - name: Safari capture fixture test
        run: node scripts/test_livepocket_safari_capture_v1.js
      - name: Direct LivePocket acquisition diagnostic
        run: |
          set -euxo pipefail
          url='https://livepocket.jp/e/3tqn7'
          echo "===== $url ====="
          curl -sS -L --compressed --max-time 20 -D /tmp/headers.txt -o /tmp/body.txt "$url" || true
          echo '--- headers ---'
          sed -n '1,40p' /tmp/headers.txt
          echo '--- bytes ---'
          wc -c /tmp/body.txt
          echo '--- body preview ---'
          head -c 500 /tmp/body.txt | tr '\n' ' ' || true
          echo
      - name: Run isolated HTTP parser probe
        run: node scripts/experimental_livepocket_tabs_v1.js
