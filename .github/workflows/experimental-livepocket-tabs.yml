name: Experimental LivePocket Tabs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/experimental_livepocket_tabs_v1.js'
      - '.github/workflows/experimental-livepocket-tabs.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Direct HTTP probe
        run: |
          set -euxo pipefail
          for url in https://livepocket.jp/e/3tqn7 https://t.livepocket.jp/e/3tqn7; do
            echo "===== $url ====="
            curl -sS -L --compressed --max-time 20 -D /tmp/headers.txt -o /tmp/body.txt "$url" || true
            echo '--- headers ---'
            sed -n '1,40p' /tmp/headers.txt
            echo '--- bytes ---'
            wc -c /tmp/body.txt
            echo '--- body preview ---'
            head -c 500 /tmp/body.txt | tr '\n' ' ' || true
            echo
          done
      - name: Run isolated tab probe
        run: node scripts/experimental_livepocket_tabs_v1.js
