name: GAS pending rescue regression

on:
  pull_request:
    paths:
      - ".github/workflows/router.yml"
      - "scripts/gas_discord_scan_client_v1.js"
      - "scripts/test_gas_discord_scan_client_v1.js"
      - ".github/workflows/gas-pending-rescue-ci.yml"

permissions:
  contents: read

jobs:
  gas-pending-rescue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
      - name: Validate public GAS Discord scan client
        run: |
          set -euo pipefail
          node --check scripts/gas_discord_scan_client_v1.js
          node --check scripts/test_gas_discord_scan_client_v1.js
          node scripts/test_gas_discord_scan_client_v1.js
      - name: Checkout private Router source
        uses: actions/checkout@v4
        with:
          repository: tobiy0715/livepocket-bot
          token: ${{ secrets.ROUTER_REPO_TOKEN }}
          ref: main
          path: router_source
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate GAS pending rescue
        working-directory: router_source
        run: |
          set -euo pipefail
          node --check scripts/gas_pending_rescue_v1.js
          node --check scripts/patch_gas_pending_rescue_v1.js
          node --check scripts/test_gas_pending_rescue_v1.js
          node scripts/test_gas_pending_rescue_v1.js
