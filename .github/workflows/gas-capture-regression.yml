name: GAS capture response regression

on:
  pull_request:
    paths:
      - ".github/workflows/router.yml"
      - "scripts/test_gas_capture_response_handler_v1.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gas-capture-response:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run GAS capture response regression
        run: |
          set -e
          node --check scripts/test_gas_capture_response_handler_v1.js
          node scripts/test_gas_capture_response_handler_v1.js
