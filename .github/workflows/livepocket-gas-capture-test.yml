name: LivePocket GAS Capture Test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  capture-test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GAS capture
        env:
          GAS_CAPTURE_URL: ${{ secrets.LP_GATE_URL }}
        run: |
          set -e
          test -n "$GAS_CAPTURE_URL"
          curl -fsSL --retry 3 --max-time 30 "$GAS_CAPTURE_URL" -o /tmp/capture.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/capture.json', 'utf8'));
          console.log(JSON.stringify({
            ok: data.ok,
            status: data.status,
            capture: data.capture || null
          }, null, 2));
          if (!data.ok) process.exit(1);
          NODE

  safari-capture-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check scripts/livepocket_safari_capture_v5_8_product_clean.js
          node --check scripts/test_livepocket_safari_capture_v5_9.js
      - name: Run isolated DOM regression tests
        run: node scripts/test_livepocket_safari_capture_v5_9.js
