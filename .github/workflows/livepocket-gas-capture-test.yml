name: LivePocket GAS Capture Test

on:
  pull_request:
    paths:
      - 'scripts/livepocket_safari_capture_v5_8_product_clean.js'
      - 'scripts/test_livepocket_safari_capture_v5_9.js'
      - '.github/workflows/livepocket-gas-capture-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GAS capture
        env:
          GAS_CAPTURE_URL: https://script.google.com/macros/s/AKfycbyxv-FTw97WImeaVzaGKSAUOkxbRLTi1hgS0LhdU_rlS47jSjMXfBaXeIJ1Sw9P1-bc/exec
        run: |
          set -euo pipefail
          test -n "$GAS_CAPTURE_URL"
          HTTP_STATUS=$(curl --silent --show-error --location --retry 3 --max-time 30 \
            --dump-header /tmp/gas-headers.txt \
            --output /tmp/capture-response.txt \
            --write-out '%{http_code}' \
            "$GAS_CAPTURE_URL")
          CONTENT_TYPE=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {value=$0} END{sub(/^[^:]*:[[:space:]]*/, "", value); sub(/\r$/, "", value); print value}' /tmp/gas-headers.txt)
          echo "GAS_HTTP_STATUS=$HTTP_STATUS"
          echo "GAS_CONTENT_TYPE=${CONTENT_TYPE:-<missing>}"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "GAS_HTTP_ERROR: endpoint did not return a 2xx response"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          let raw = fs.readFileSync('/tmp/capture-response.txt', 'utf8').trim();
          if (raw.charCodeAt(0) === 0xFEFF) raw = raw.slice(1);
          let data;
          try {
            data = JSON.parse(raw);
          } catch {
            const readable = raw
              .replace(/<script[\\s\\S]*?<\\/script>/gi, ' ')
              .replace(/<style[\\s\\S]*?<\\/style>/gi, ' ')
              .replace(/<[^>]*>/g, ' ')
              .replace(/&nbsp;|&#160;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/\\s+/g, ' ')
              .trim();
            console.error('GAS_RESPONSE_NOT_JSON');
            console.error('GAS_RESPONSE_TEXT=' + readable.slice(0, 4000));
            process.exit(1);
          }
          console.log(JSON.stringify({
            ok: data.ok,
            status: data.status,
            capture: data.capture || null
          }, null, 2));
          if (data.ok !== true) process.exit(1);
          NODE

  safari-capture-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check scripts/livepocket_safari_capture_v5_8_product_clean.js
          node --check scripts/test_livepocket_safari_capture_v5_9.js
      - name: Run isolated DOM regression tests
        run: node scripts/test_livepocket_safari_capture_v5_9.js
