name: Experimental LivePocket Search Index

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Search query (example: ポケモンカード 抽選)'
        required: true
        default: 'ポケモンカード 抽選'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: node --check scripts/experimental_livepocket_search_index_v1.js

      - name: Run search-index acquisition probe
        env:
          SEARCH_QUERY: ${{ inputs.query }}
        run: node scripts/experimental_livepocket_search_index_v1.js
