name: Experimental LivePocket Browser V1

on:
  workflow_dispatch:

jobs:
  browser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Chromium if needed
        run: |
          if command -v chromium >/dev/null 2>&1; then
            echo "Chromium already installed"
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome already installed"
          else
            sudo apt-get update
            sudo apt-get install -y chromium
          fi

      - name: Browser version
        run: |
          (chromium --version || google-chrome --version || true)

      - name: Syntax check
        run: node --check scripts/experimental_livepocket_browser_v1.js

      - name: Run real-browser acquisition probe
        env:
          SEARCH_QUERY: ポケモンカード 抽選
        run: node scripts/experimental_livepocket_browser_v1.js
